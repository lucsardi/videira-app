<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videira App</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div id="app-sidebar"></div>
  <header id="app-topbar"></header>

  <main class="vd-container" style="max-width: 680px;">
    <h1 class="h4 fw-bold mb-3">Relatórios</h1>

    <ul class="nav nav-pills mb-3" id="abasRelatorio">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#painelResumo" type="button">📊 Resumo por
          Conexão</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#painelPdf" type="button">📄 Gerar PDF</button>
      </li>
    </ul>

    <div class="tab-content">

      <!-- ================= RESUMO POR CONEXÃO ================= -->
      <div class="tab-pane fade show active" id="painelResumo">

        <div id="cardsResumoConexao" class="row g-2 mb-3">
          <div class="col-12">
            <div class="card p-3 text-muted small">Carregando...</div>
          </div>
        </div>

        <div class="card p-3 mb-3">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h2 class="h6 fw-bold mb-0">Aniversários por mês</h2>
            <select class="form-select form-select-sm d-none" id="filtroConexaoGrafico" style="max-width: 200px;">
              <option value="">Todas as conexões</option>
            </select>
          </div>
          <canvas id="graficoMensal" height="180"></canvas>
        </div>

      </div>

      <!-- ================= GERAR PDF ================= -->
      <div class="tab-pane fade" id="painelPdf">

        <div class="card p-3 mb-3">
          <div class="btn-group mb-3" role="group">
            <input type="radio" class="btn-check" name="tipoRelatorio" id="tipoAniversario" value="aniversario" checked>
            <label class="btn btn-outline-primary" for="tipoAniversario">🎂 Aniversários</label>

            <input type="radio" class="btn-check" name="tipoRelatorio" id="tipoCasamento" value="casamento">
            <label class="btn btn-outline-primary" for="tipoCasamento">💍 Casamentos</label>
          </div>

          <div class="mb-3" id="colFiltroConexao">
            <label class="form-label">Conexão</label>
            <select class="form-select" id="filtroConexao">
              <option value="">Todas as conexões</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label">Mês</label>
            <select class="form-select" id="filtroMes">
              <option value="">Todos os meses</option>
            </select>
          </div>

          <button class="btn btn-primary w-100" id="btnPreview">Gerar prévia</button>
        </div>

        <div id="listaPreview" class="mb-3"></div>

        <button class="btn btn-celebration w-100 d-none" id="btnBaixarPdf">📄 Baixar PDF</button>
      </div>

    </div>
  </main>

  <div id="app-bottomnav"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/resumo.js"></script>
  <script src="js/relatorios.js"></script>
</body>

</html>

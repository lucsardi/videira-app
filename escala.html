<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Escala — Videira App</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#439965">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Videira">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-sidebar"></div>
  <header id="app-topbar"></header>

  <main class="vd-container" style="max-width: 560px;">
    <h1 class="h4 fw-bold mb-1">📋 Escala</h1>
    <p class="text-muted small mb-3">Quem é responsável por postar os aniversários em cada data.</p>

    <div id="blocoNovaEscala" class="card p-3 mb-4 d-none">
      <h2 class="h6 fw-bold mb-2">Adicionar à escala</h2>
      <div id="msgErroEscala" class="alert alert-danger d-none"></div>
      <form id="formEscala" class="row g-2">
        <div class="col-12 col-sm-5">
          <label class="form-label small mb-1">Data</label>
          <input type="date" class="form-control" id="escalaData" required>
        </div>
        <div class="col-12 col-sm-7">
          <label class="form-label small mb-1">Responsável</label>
          <select class="form-select" id="escalaPessoa" required>
            <option value="">Selecione uma pessoa...</option>
          </select>
        </div>
        <div class="col-12">
          <label class="form-label small mb-1">Observações (opcional)</label>
          <input type="text" class="form-control" id="escalaObs" placeholder="Ex: postar no Instagram e no grupo do WhatsApp">
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary w-100" id="btnAdicionarEscala">Adicionar</button>
        </div>
      </form>
    </div>

    <ul class="nav nav-pills mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#painelProximas" type="button">Próximas</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="pill" data-bs-target="#painelPassadas" type="button">Anteriores</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="painelProximas">
        <div id="listaEscalaProximas">
          <div class="text-center text-muted py-3">Carregando...</div>
        </div>
      </div>
      <div class="tab-pane fade" id="painelPassadas">
        <div id="listaEscalaPassadas">
          <div class="text-center text-muted py-3">Carregando...</div>
        </div>
      </div>
    </div>
  </main>

  <div id="app-bottomnav"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/escala.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>

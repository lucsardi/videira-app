<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videira App</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>

<body>
  <div id="app-sidebar"></div>
  <header id="app-topbar"></header>

  <main class="vd-container">
    <div class="d-flex justify-content-between align-items-start mb-3">
      <div>
        <h1 class="h4 fw-bold mb-0">Aniversariantes</h1>
        <p class="text-muted small mb-0">Gerencie e acompanhe todos os aniversários.</p>
      </div>
      <a href="novo.html" class="btn btn-primary btn-sm d-none" id="btnNovo">+ Adicionar</a>
    </div>

    <div class="d-flex gap-2 mb-3 flex-wrap" id="filtroPeriodo" role="group">
      <button type="button" class="btn btn-sm btn-outline-primary active" data-periodo="">Todos</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-periodo="hoje">Hoje</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-periodo="amanha">Amanhã</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-periodo="semana">Esta semana</button>
      <button type="button" class="btn btn-sm btn-outline-primary" data-periodo="mes">Este mês</button>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-12">
        <input type="search" id="filtroBusca" class="form-control" placeholder="Buscar aniversariante...">
      </div>
      <div class="col-6" id="colConexao">
        <select id="filtroConexao" class="form-select">
          <option value="">Todas conexões</option>
        </select>
      </div>
      <div class="col-6">
        <select id="filtroMes" class="form-select">
          <option value="">Todos os meses</option>
        </select>
      </div>
    </div>

    <p class="text-muted small" id="contagem"></p>

    <div id="listaMembros">
      <div class="text-center text-muted py-4">Carregando...</div>
    </div>
  </main>

  <div id="app-bottomnav"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/membros.js"></script>
</body>

</html>

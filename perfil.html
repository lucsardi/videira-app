<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Perfil — Videira App</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-sidebar"></div>
  <header id="app-topbar"></header>

  <main class="vd-container" style="max-width: 480px;">
    <h1 class="h4 fw-bold mb-3">Meu perfil</h1>

    <div id="msgErroPerfil" class="alert alert-danger d-none"></div>
    <div id="msgSucessoPerfil" class="alert alert-success d-none"></div>

    <div class="card p-3 mb-3">
      <h2 class="h6 fw-bold mb-2">Meus dados</h2>
      <form id="formPerfil">
        <div class="mb-3">
          <label class="form-label">Nome completo</label>
          <input type="text" class="form-control" id="perfilNome" required>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" id="perfilEmail" disabled>
        </div>
        <div class="mb-3">
          <label class="form-label">Papel</label>
          <input type="text" class="form-control" id="perfilPapel" disabled>
        </div>
        <div class="mb-3 d-none" id="grupoPerfilConexao">
          <label class="form-label">Conexão</label>
          <input type="text" class="form-control" id="perfilConexao" disabled>
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnSalvarPerfil">Salvar nome</button>
      </form>
    </div>

    <div class="card p-3 mb-3">
      <h2 class="h6 fw-bold mb-2">Trocar senha</h2>
      <div id="msgErroSenha" class="alert alert-danger d-none"></div>
      <div id="msgSucessoSenha" class="alert alert-success d-none"></div>
      <form id="formSenha">
        <div class="mb-3">
          <label class="form-label">Nova senha</label>
          <input type="password" class="form-control" id="novaSenha" required minlength="6" placeholder="Mínimo 6 caracteres">
        </div>
        <div class="mb-3">
          <label class="form-label">Confirmar nova senha</label>
          <input type="password" class="form-control" id="confirmarSenha" required minlength="6">
        </div>
        <button type="submit" class="btn btn-outline-primary w-100" id="btnTrocarSenha">Atualizar senha</button>
      </form>
    </div>
  </main>

  <div id="app-bottomnav"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/perfil.js"></script>
</body>
</html>

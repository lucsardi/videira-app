<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Conexões — Videira App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-sidebar"></div>
  <header id="app-topbar"></header>

  <main class="vd-container">
    <h1 class="h4 fw-bold mb-1">Conexões</h1>
    <p class="text-muted small mb-3">Gerencie as células/conexões da igreja.</p>

    <form id="formNovaConexao" class="d-flex gap-2 mb-3">
      <input type="text" id="nomeNovaConexao" class="form-control" placeholder="Nome da nova conexão" required>
      <button type="submit" class="btn btn-primary">Adicionar</button>
    </form>

    <div id="msgErro" class="alert alert-danger d-none"></div>

    <div id="listaConexoes">
      <div class="text-center text-muted py-3">Carregando...</div>
    </div>

    <div class="alert alert-warning small mt-4">
      <strong>Como dar acesso a um líder:</strong><br>
      Vá na tela <a href="usuarios.html">Usuários</a> e use o botão "Convidar novo usuário" —
      você escolhe o papel e a conexão, gera um link e envia por WhatsApp ou e-mail. Sem
      precisar mexer no Supabase.
    </div>
  </main>

  <div id="app-bottomnav"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/conexoes.js"></script>
</body>
</html>

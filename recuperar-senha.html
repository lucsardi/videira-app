<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Recuperar senha — Videira App</title>
  <link rel="icon" type="image/x-icon" href="assets/icons/favicon/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/favicon/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
</head>
<body style="padding: 0;">
  <div class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div style="max-width: 380px; width: 100%;" class="p-4">
      <div class="text-center mb-4">
        <img src="assets/images/logo_videira_app.png" alt="Videira App" style="max-width: 180px; width: 100%; height: auto;">
      </div>

      <h1 class="h5 fw-bold mb-1">Recuperar senha</h1>
      <p class="text-muted small mb-3">Informe seu e-mail e enviaremos um link para você criar uma nova senha.</p>

      <div id="msgResultado" class="alert d-none"></div>

      <form id="formRecuperar">
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" class="form-control" id="email" required placeholder="seu@email.com">
        </div>
        <button type="submit" class="btn btn-primary w-100" id="btnEnviar">Enviar link</button>
      </form>

      <a href="login.html" class="d-block text-center small mt-3">← Voltar para o login</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/recuperar-senha.js"></script>
</body>
</html>

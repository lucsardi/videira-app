<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Videira App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div id="app-sidebar"></div>
  <header id="app-topbar"></header>

  <main class="vd-container">
    <div class="mb-4">
      <h1 class="h4 fw-bold mb-0" id="saudacao">Olá! 👋</h1>
      <p class="text-muted small" id="dataHoje"></p>
    </div>

    <div class="row g-2 mb-4" id="cardsIndicadores">
      <div class="col-6 col-md-3">
        <div class="vd-indicador destaque placeholder-glow"><span class="placeholder col-12" style="height:60px;"></span></div>
      </div>
    </div>

    <section class="mb-4">
      <h2 class="text-uppercase small fw-semibold mb-2" style="color: var(--vd-text-secondary);">🎉 Aniversariantes de hoje</h2>
      <div id="listaHoje">
        <div class="text-center text-muted py-3">Carregando...</div>
      </div>
    </section>

    <section class="mb-4">
      <h2 class="text-uppercase small fw-semibold mb-2" style="color: var(--vd-text-secondary);">📅 Próximos aniversários</h2>
      <div id="listaProximos">
        <div class="text-center text-muted py-3">Carregando...</div>
      </div>
    </section>

    <section class="mb-4 d-none" id="secaoConexoesDestaque">
      <h2 class="text-uppercase small fw-semibold mb-2" style="color: var(--vd-text-secondary);">🌿 Conexões em destaque</h2>
      <div id="listaConexoesDestaque"></div>
    </section>

    <div class="d-flex gap-2 mb-4" id="botoesRodape">
      <a href="membros.html" class="btn btn-outline-primary flex-fill">Ver todos</a>
    </div>
  </main>

  <div id="app-bottomnav"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>

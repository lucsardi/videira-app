<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videira App — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/theme.css" rel="stylesheet">
</head>
<body style="padding: 0;">
  <div class="row g-0" style="min-height: 100vh;">

    <!-- Coluna institucional (some no mobile) -->
    <div class="col-md-6 d-none d-md-flex flex-column justify-content-center align-items-center text-center p-5"
         style="background: linear-gradient(160deg, var(--vd-green-50), var(--vd-berry-50));">
      <div class="vd-logo" style="font-size: 2.6rem;">Videira</div>
      <span class="vd-logo-sub mb-3">APP</span>
      <p class="vd-tagline fw-semibold" style="max-width: 320px;">
        Conectando pessoas.<br>Celebrando vidas.
      </p>
      <div style="font-size: 3rem; margin-top: 24px;">🍇🌿🎉</div>
    </div>

    <!-- Coluna do formulário -->
    <div class="col-12 col-md-6 d-flex align-items-center justify-content-center p-4">
      <div style="max-width: 360px; width: 100%;">
        <div class="d-md-none text-center mb-4">
          <div class="vd-logo">Videira</div>
          <span class="vd-logo-sub">APP</span>
        </div>

        <h1 class="h4 fw-bold mb-1">Bem-vindo de volta! 👋</h1>
        <p class="text-muted small mb-4">Faça login para continuar</p>

        <div id="msgErro" class="alert alert-danger d-none" role="alert"></div>

        <form id="formLogin">
          <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input type="email" class="form-control" id="email" required placeholder="seu@email.com">
          </div>
          <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input type="password" class="form-control" id="senha" required placeholder="••••••••">
          </div>
          <button type="submit" class="btn btn-primary w-100" id="btnEntrar">Entrar →</button>
        </form>

        <p class="text-muted text-center small mt-4 mb-0">
          Ainda não tem acesso? Fale com o administrador.
        </p>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script>
    (async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = "index.html";
    })();

    const formLogin = document.getElementById("formLogin");
    const msgErro = document.getElementById("msgErro");
    const btnEntrar = document.getElementById("btnEntrar");

    formLogin.addEventListener("submit", async (e) => {
      e.preventDefault();
      msgErro.classList.add("d-none");
      btnEntrar.disabled = true;
      btnEntrar.textContent = "Entrando...";

      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      const { error } = await sb.auth.signInWithPassword({ email, password: senha });

      btnEntrar.disabled = false;
      btnEntrar.textContent = "Entrar →";

      if (error) {
        msgErro.textContent = "E-mail ou senha inválidos.";
        msgErro.classList.remove("d-none");
        return;
      }

      window.location.href = "index.html";
    });
  </script>
</body>
</html>
